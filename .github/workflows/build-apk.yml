name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiCiclo-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publicar enlace de descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MiCiclo.apk
          gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Mi Ciclo" --notes "Última versión de la app."
          gh release upload ultima MiCiclo.apk --clobber
