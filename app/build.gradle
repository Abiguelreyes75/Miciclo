plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cerquita.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cerquita.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Clave fija para que cada compilación pueda actualizar la app sin perder los datos.
    signingConfigs {
        personal {
            storeFile file('cerquita.jks')
            storePassword 'cerquita-personal'
            keyAlias 'cerquita'
            keyPassword 'cerquita-personal'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
