<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Ciclo</title>
<style>
:root{--bg:#fbf5f0;--card:#fffdfb;--ink:#2e1f26;--soft:#75626b;--line:#e8dcd5;--period:#b8324f;--period-soft:#f6d9de;--fertile:#2f7f78;--fertile-soft:#d5ece8;--pred:#d0758a;--accent:#7a2440;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1317;--card:#271c21;--ink:#f6ebee;--soft:#b9a6ae;--line:#3e2f35;--period:#ec6a85;--period-soft:#552532;--fertile:#6fc9bf;--fertile-soft:#1e4441;--pred:#d98a9c;--accent:#f0a0b2;--on:#2a1017}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Georgia,'Noto Serif',serif;font-weight:500;margin:0}
main{max-width:520px;margin:auto;padding:20px 16px 96px}
.top{font-size:26px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{text-align:center;padding:26px 16px}
.hero .kicker{color:var(--soft);font-size:14px}
.hero .big{font:500 44px/1.15 Georgia,'Noto Serif',serif;margin:6px 0}
.hero .sub{color:var(--soft)}
.track{display:flex;gap:2px;margin:20px 0 6px;height:10px}
.track i{flex:1;border-radius:3px;background:var(--line)}
.track i.p{background:var(--period)}.track i.f{background:var(--fertile)}
.track i.now{outline:2px solid var(--ink);outline-offset:1px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--accent);color:var(--on);font-weight:600;margin-top:10px}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--period);color:var(--period)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row span:first-child{color:var(--soft)}.row b{font-weight:600;text-align:right}
.note{font-size:13px;color:var(--soft);margin:12px 4px}
.warn{border-color:var(--pred);font-size:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h2{font-size:21px;text-transform:capitalize}
.nav{width:44px;height:44px;font-size:22px;border-radius:50%;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--soft);padding:4px 0}
.d{aspect-ratio:1;border-radius:50%;position:relative;font-size:15px;min-width:0}
.d.out{visibility:hidden}.d.period{background:var(--period);color:var(--on);font-weight:600}
.d.pred{border:2px dashed var(--pred)}.d.fert{background:var(--fertile-soft)}
.d.ovu{background:var(--fertile);color:var(--on);font-weight:600}
.d.today{box-shadow:0 0 0 2px var(--ink)}
.d.log::after{content:"";position:absolute;bottom:12%;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--soft);margin-top:14px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:16px 4px;color:var(--soft);font-size:14px}
.tabs button.on{color:var(--accent);font-weight:700}
.scrim{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px}
.sheet h3{font-size:22px;margin-bottom:4px}
.label{font-weight:600;margin:16px 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
input,textarea{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:76px;resize:vertical}
.bar{height:8px;border-radius:4px;background:var(--fertile);margin-top:4px}
.hist{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.hist:first-of-type{border-top:0}
.hist div:first-child{display:flex;justify-content:space-between}
.hist span{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:14px;z-index:9;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<script>
'use strict';
var KEY='miciclo.v1',DAY=864e5;
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var FLOWS={ligero:'Ligero',medio:'Medio',abundante:'Abundante'};
var SYMPTOMS=['Cólicos','Dolor de cabeza','Dolor de espalda','Sensibilidad en senos','Hinchazón','Acné','Cansancio','Náuseas','Antojos','Cambios de ánimo','Ansiedad','Insomnio'];
var MIN_CYCLE=15,MAX_CYCLE=60;

/* ---- fechas: número de día absoluto para evitar errores de horario de verano ---- */
function toN(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/DAY}
function toS(n){return new Date(n*DAY).toISOString().slice(0,10)}
function todayS(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function nice(n){var d=new Date(n*DAY);return d.getUTCDate()+' de '+MONTHS[d.getUTCMonth()]}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---- lógica ---- */
function periods(logs){
  var days=Object.keys(logs).filter(function(k){return logs[k].flow}).map(toN).sort(function(a,b){return a-b});
  var out=[];
  days.forEach(function(n){var l=out[out.length-1];
    if(l&&n-l.end<=2)l.end=n;else out.push({start:n,end:n})});
  return out;
}
function mean(a){return a.reduce(function(x,y){return x+y},0)/a.length}
function analyze(st,today){
  var ps=periods(st.logs),cycles=[],i;
  for(i=1;i<ps.length;i++)cycles.push(ps[i].start-ps[i-1].start);
  var valid=cycles.filter(function(c){return c>=MIN_CYCLE&&c<=MAX_CYCLE}).slice(-6);
  var cycleLen=valid.length?Math.round(mean(valid)):st.settings.cycle;
  var lens=ps.filter(function(p){return p.end<today}).slice(-6).map(function(p){return p.end-p.start+1});
  var periodLen=lens.length?Math.round(mean(lens)):st.settings.period;
  var r={periods:ps,cycles:cycles,valid:valid,cycleLen:cycleLen,periodLen:periodLen,forecast:[],overdue:0,
    range:valid.length>1?Math.max.apply(0,valid)-Math.min.apply(0,valid):0};
  if(!ps.length)return r;
  var last=ps[ps.length-1];
  r.last=last;r.cycleDay=today-last.start+1;
  var next=last.start+cycleLen;
  if(next<today){r.overdue=today-next;next=today}
  for(i=0;i<6;i++){var s=next+i*cycleLen;
    r.forecast.push({start:s,end:s+periodLen-1,ovu:s-14,fertStart:s-19,fertEnd:s-13})}
  r.next=r.forecast[0];
  return r;
}
function classify(n,a,logs,today){
  var s=toS(n),l=logs[s],c={};
  if(l&&l.flow)c.period=true;
  if(l&&(l.flow||(l.symptoms&&l.symptoms.length)||l.note))c.log=true;
  if(n>=today)a.forecast.forEach(function(f){
    if(n>=f.start&&n<=f.end&&!c.period)c.pred=true;
    if(n>=f.fertStart&&n<=f.fertEnd&&!c.period&&!c.pred)c[n===f.ovu?'ovu':'fert']=true;
  });
  return c;
}

/* ---- almacenamiento: solo en este teléfono ---- */
var mem=null;
function fresh(){return{logs:{},settings:{cycle:28,period:5},onboarded:false}}
function valid(o){return o&&typeof o==='object'&&o.logs&&typeof o.logs==='object'&&o.settings&&
  +o.settings.cycle>=MIN_CYCLE&&+o.settings.cycle<=MAX_CYCLE&&+o.settings.period>=1&&+o.settings.period<=15&&
  Object.keys(o.logs).every(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&o.logs[k]&&typeof o.logs[k]==='object'&&
    (!o.logs[k].flow||FLOWS.hasOwnProperty(o.logs[k].flow))&&(!o.logs[k].symptoms||Array.isArray(o.logs[k].symptoms))})}
function load(){try{var o=JSON.parse(localStorage.getItem(KEY));if(valid(o))return o}catch(e){}return mem||fresh()}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}}

/* ---- interfaz ---- */
var S=load(),tab='hoy',view=null,sheetOpen=false;
var $=function(id){return document.getElementById(id)};
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2400)}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  $('tabs').style.display=S.onboarded?'flex':'none';
  if(!S.onboarded)return renderOnboard();
  $('tabs').innerHTML=[['hoy','Hoy'],['cal','Calendario'],['stats','Resumen'],['ajustes','Ajustes']].map(function(t){
    return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  ({hoy:renderHoy,cal:renderCal,stats:renderStats,ajustes:renderAjustes})[tab]();
}
function renderOnboard(){
  var t=todayS();
  $('app').innerHTML='<h1 class="top">Te damos la bienvenida</h1><div class="card">'+
  '<p style="margin-top:0">Tres datos para empezar. Las predicciones mejoran a medida que registras más ciclos.</p>'+
  '<div class="label">¿Cuándo empezó tu último periodo?</div><input type="date" id="o1" max="'+t+'" value="'+t+'">'+
  '<div class="label">¿Cuántos días suele durar tu periodo?</div><input type="number" id="o2" min="1" max="15" value="5" inputmode="numeric">'+
  '<div class="label">¿Cada cuántos días suele llegar?</div><input type="number" id="o3" min="15" max="60" value="28" inputmode="numeric">'+
  '<p class="note">Si no lo sabes con certeza, deja 5 y 28: la app se ajustará con tus registros.</p>'+
  '<button class="btn" onclick="finishOnboard()">Empezar</button></div>'+
  '<p class="note">Tus datos se guardan solo en este teléfono. La app no tiene permiso para usar internet.</p>';
}
function finishOnboard(){
  var d=$('o1').value,p=+$('o2').value,c=+$('o3').value,t=todayS();
  if(!d||d>t)return toast('Elige una fecha que no sea futura');
  if(!(p>=1&&p<=15))return toast('La duración debe ser de 1 a 15 días');
  if(!(c>=15&&c<=60))return toast('El ciclo debe ser de 15 a 60 días');
  S.settings={cycle:c,period:p};S.onboarded=true;fillPeriod(d,p);save();render();
}
function fillPeriod(from,len){
  var n=toN(from),t=toN(todayS());
  for(var i=0;i<len&&n+i<=t;i++){var k=toS(n+i);S.logs[k]=S.logs[k]||{};if(!S.logs[k].flow)S.logs[k].flow='medio'}
}
function renderHoy(){
  var t=toN(todayS()),a=analyze(S,t),h='<h1 class="top">Hoy, '+nice(t)+'</h1>';
  if(!a.last){
    h+='<div class="card hero"><div class="big">Sin datos</div><div class="sub">Registra tu periodo para ver predicciones.</div></div>';
  }else{
    var inP=!!(S.logs[toS(t)]&&S.logs[toS(t)].flow),kicker='Día '+a.cycleDay+' del ciclo',big,sub;
    if(inP){big='Periodo';sub='Día '+(t-a.last.start+1)+' de tu periodo'}
    else if(a.overdue>0){big=plural(a.overdue,'día')+' de retraso';sub='Se esperaba el '+nice(t-a.overdue)}
    else if(a.next.start===t){big='Podría llegar hoy';sub='Tu periodo está previsto para hoy'}
    else{var dd=a.next.start-t;big=(dd===1?'Falta 1 día':'Faltan '+dd+' días');sub='para tu próximo periodo'}
    var total=Math.max(a.cycleLen,a.cycleDay),track='';
    var ovuDay=a.cycleLen-13;
    for(var i=1;i<=total;i++){var cl=i<=a.periodLen?'p':(i>=ovuDay-5&&i<=ovuDay+1?'f':'');
      track+='<i class="'+cl+(i===a.cycleDay?' now':'')+'"></i>'}
    h+='<div class="card hero"><div class="kicker">'+kicker+'</div><div class="big">'+big+'</div><div class="sub">'+sub+'</div><div class="track" aria-hidden="true">'+track+'</div></div>';
    var f=a.next,past=f.fertEnd<t;
    h+='<div class="card"><div class="row"><span>Próximo periodo</span><b>'+nice(f.start)+'</b></div>'+
       '<div class="row"><span>Días fértiles estimados</span><b>'+(past?nice(a.forecast[1].fertStart)+' al '+nice(a.forecast[1].fertEnd):nice(f.fertStart)+' al '+nice(f.fertEnd))+'</b></div>'+
       '<div class="row"><span>Ciclo promedio</span><b>'+plural(a.cycleLen,'día')+'</b></div></div>';
    if(a.overdue>=7)h+='<div class="card warn">Tu periodo lleva más de una semana de retraso. Si hubo posibilidad de embarazo, una prueba puede aclararlo; y si los retrasos se repiten, conviene consultarlo con un profesional de salud.</div>';
  }
  var inToday=S.logs[toS(t)]&&S.logs[toS(t)].flow;
  if(!inToday)h+='<button class="btn" onclick="startToday()">Mi periodo empezó hoy</button>';
  h+='<button class="btn alt" onclick="openDay(\''+toS(t)+'\')">Registrar síntomas o notas de hoy</button>';
  h+='<p class="note">Las fechas son estimaciones. No uses esta app como método anticonceptivo.</p>';
  $('app').innerHTML=h;
}
function startToday(){var k=todayS();S.logs[k]=S.logs[k]||{};S.logs[k].flow='medio';save();render();toast('Periodo registrado')}
function renderCal(){
  var ts=todayS(),t=toN(ts);
  if(!view)view={y:+ts.slice(0,4),m:+ts.slice(5,7)-1};
  var a=analyze(S,t),first=new Date(Date.UTC(view.y,view.m,1)),n0=first.getTime()/DAY,
      offset=(first.getUTCDay()+6)%7,count=new Date(Date.UTC(view.y,view.m+1,0)).getUTCDate(),h='';
  h+='<div class="card"><div class="cal-h"><button class="nav" aria-label="Mes anterior" onclick="shift(-1)">‹</button><h2>'+MONTHS[view.m]+' '+view.y+'</h2><button class="nav" aria-label="Mes siguiente" onclick="shift(1)">›</button></div><div class="grid">';
  ['L','M','X','J','V','S','D'].forEach(function(d){h+='<div class="dow">'+d+'</div>'});
  for(var i=0;i<offset;i++)h+='<div class="d out"></div>';
  for(var d=0;d<count;d++){var n=n0+d,c=classify(n,a,S.logs,t),k=Object.keys(c).join(' ');
    h+='<button class="d '+k+(n===t?' today':'')+'" aria-label="'+nice(n)+'" onclick="openDay(\''+toS(n)+'\')">'+(d+1)+'</button>'}
  h+='</div><div class="legend"><span><i style="background:var(--period)"></i>Periodo</span><span><i style="border:2px dashed var(--pred)"></i>Previsto</span><span><i style="background:var(--fertile-soft)"></i>Fértil</span><span><i style="background:var(--fertile)"></i>Ovulación</span></div></div>';
  h+='<p class="note">Toca un día para registrar o corregir. Las predicciones son estimaciones.</p>';
  $('app').innerHTML=h;
}
function shift(x){var m=view.m+x;view={y:view.y+Math.floor(m/12),m:((m%12)+12)%12};render()}
function openDay(k){
  var n=toN(k),t=toN(todayS()),future=n>t,l=S.logs[k]||{},a=analyze(S,t),h='<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+nice(n)+'</h3>';
  if(future){
    var c=classify(n,a,S.logs,t),msg=c.pred?'Periodo previsto.':c.ovu?'Ovulación estimada.':c.fert?'Día fértil estimado.':'Sin predicciones para este día.';
    h+='<p>'+msg+'</p><p class="note">No se pueden registrar días futuros.</p><button class="btn alt" onclick="closeSheet()">Cerrar</button></div></div>';
    $('modal').innerHTML=h;sheetOpen=true;return;
  }
  h+='<div class="label">Periodo</div><div class="chips"><button class="chip '+(!l.flow?'on':'')+'" onclick="setFlow(\''+k+'\',\'\')">Sin sangrado</button>';
  Object.keys(FLOWS).forEach(function(f){h+='<button class="chip '+(l.flow===f?'on':'')+'" onclick="setFlow(\''+k+'\',\''+f+'\')">'+FLOWS[f]+'</button>'});
  h+='</div>';
  if(l.flow&&n<t)h+='<button class="btn alt" onclick="fillFrom(\''+k+'\')">Marcar '+plural(a.periodLen,'día')+' desde esta fecha</button>';
  h+='<div class="label">Síntomas</div><div class="chips">';
  SYMPTOMS.forEach(function(s,i){var on=(l.symptoms||[]).indexOf(s)>=0;h+='<button class="chip '+(on?'on':'')+'" onclick="togSym(\''+k+'\','+i+')">'+s+'</button>'});
  h+='</div><div class="label">Notas</div><textarea id="note" onchange="setNote(\''+k+'\',this.value)">'+esc(l.note||'')+'</textarea>'+
     '<button class="btn" onclick="setNote(\''+k+'\',$(\'note\').value);closeSheet()">Listo</button></div></div>';
  $('modal').innerHTML=h;sheetOpen=true;
}
function clean(k){var l=S.logs[k];if(l&&!l.flow&&!(l.symptoms&&l.symptoms.length)&&!l.note)delete S.logs[k]}
function setFlow(k,f){var note=$('note')&&$('note').value;S.logs[k]=S.logs[k]||{};if(note!==undefined&&note!==null)S.logs[k].note=note;if(f)S.logs[k].flow=f;else delete S.logs[k].flow;clean(k);save();openDay(k);render()}
function fillFrom(k){fillPeriod(k,analyze(S,toN(todayS())).periodLen);save();closeSheet();toast('Periodo marcado')}
function togSym(k,i){var note=$('note').value,l=S.logs[k]=S.logs[k]||{},a=l.symptoms=l.symptoms||[],s=SYMPTOMS[i],p=a.indexOf(s);l.note=note;if(p>=0)a.splice(p,1);else a.push(s);clean(k);save();openDay(k);render()}
function setNote(k,v){S.logs[k]=S.logs[k]||{};S.logs[k].note=v.trim();clean(k);save()}
function closeSheet(){$('modal').innerHTML='';sheetOpen=false;render()}
function renderStats(){
  var t=toN(todayS()),a=analyze(S,t),h='<h1 class="top">Resumen</h1><div class="card">'+
  '<div class="row"><span>Duración del ciclo</span><b>'+plural(a.cycleLen,'día')+(a.valid.length?'':' (tu dato inicial)')+'</b></div>'+
  '<div class="row"><span>Duración del periodo</span><b>'+plural(a.periodLen,'día')+'</b></div>'+
  '<div class="row"><span>Ciclos registrados</span><b>'+a.cycles.length+'</b></div>'+
  (a.valid.length>1?'<div class="row"><span>Variación reciente</span><b>'+plural(a.range,'día')+'</b></div>':'')+'</div>';
  if(a.range>7)h+='<div class="card warn">Tus ciclos recientes varían más de 7 días, así que las predicciones serán menos precisas. Si te preocupa, coméntalo con un profesional de salud.</div>';
  if(a.periods.length){
    h+='<div class="card"><h2 style="font-size:19px;margin-bottom:8px">Historial</h2>';
    a.periods.slice().reverse().slice(0,12).forEach(function(p,i,arr){
      var next=arr[i-1],len=next?next.start-p.start:null;
      h+='<div class="hist"><div><b>'+nice(p.start)+' '+new Date(p.start*DAY).getUTCFullYear()+'</b><span>'+plural(p.end-p.start+1,'día')+' de periodo</span></div>'+
      (len?'<span>Ciclo de '+plural(len,'día')+'</span><div class="bar" style="width:'+Math.min(100,len/MAX_CYCLE*100)+'%"></div>':'<span>Ciclo actual</span>')+'</div>'});
    h+='</div>';
  }
  var counts={};Object.keys(S.logs).forEach(function(k){(S.logs[k].symptoms||[]).forEach(function(s){counts[s]=(counts[s]||0)+1})});
  var top=Object.keys(counts).sort(function(x,y){return counts[y]-counts[x]}).slice(0,6);
  if(top.length){h+='<div class="card"><h2 style="font-size:19px;margin-bottom:8px">Síntomas más frecuentes</h2>';
    top.forEach(function(s){h+='<div class="row"><span>'+esc(s)+'</span><b>'+plural(counts[s],'vez').replace('vezs','veces')+'</b></div>'});h+='</div>'}
  $('app').innerHTML=h;
}
function renderAjustes(){
  $('app').innerHTML='<h1 class="top">Ajustes</h1><div class="card"><p style="margin-top:0;color:var(--soft);font-size:14px">Se usan hasta que tengas registros suficientes.</p>'+
  '<div class="label">Duración del periodo (días)</div><input type="number" id="s2" min="1" max="15" value="'+S.settings.period+'">'+
  '<div class="label">Duración del ciclo (días)</div><input type="number" id="s1" min="15" max="60" value="'+S.settings.cycle+'">'+
  '<button class="btn" onclick="saveSettings()">Guardar</button></div>'+
  '<div class="card"><h2 style="font-size:19px">Copia de seguridad</h2><p style="color:var(--soft);font-size:14px">Si desinstalas la app se borran tus datos. Guarda una copia antes de cambiar de teléfono.</p>'+
  '<button class="btn alt" onclick="exportData()">Exportar datos</button><button class="btn alt" onclick="importSheet()">Importar datos</button></div>'+
  '<div class="card"><button class="btn danger" style="margin-top:0" onclick="wipeSheet()">Borrar todos mis datos</button></div>'+
  '<p class="note">Mi Ciclo funciona sin internet y no envía tus datos a ningún lugar. No sustituye la atención médica ni es un método anticonceptivo.</p>';
}
function saveSettings(){var p=+$('s2').value,c=+$('s1').value;
  if(!(p>=1&&p<=15)||!(c>=15&&c<=60))return toast('Periodo: 1 a 15 días. Ciclo: 15 a 60');
  S.settings={cycle:c,period:p};save();toast('Guardado')}
function exportData(){var txt=JSON.stringify(S);
  if(window.Android&&Android.share){Android.share(txt);return}
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copiado al portapapeles')},function(){toast('No se pudo copiar')})}}
function importSheet(){$('modal').innerHTML='<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>Importar datos</h3><p class="note">Pega el texto que exportaste. Reemplazará los datos actuales.</p><textarea id="imp"></textarea><button class="btn" onclick="doImport()">Importar</button><button class="btn alt" onclick="closeSheet()">Cancelar</button></div></div>';sheetOpen=true}
function doImport(){try{var o=JSON.parse($('imp').value);if(!valid(o))throw 0;o.onboarded=true;S=o;save();closeSheet();toast('Datos importados')}catch(e){toast('El texto no es una copia válida')}}
function wipeSheet(){$('modal').innerHTML='<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>¿Borrar todo?</h3><p>Se eliminarán todos tus registros de este teléfono. No se puede deshacer.</p><button class="btn danger" onclick="doWipe()">Sí, borrar todo</button><button class="btn alt" onclick="closeSheet()">Cancelar</button></div></div>';sheetOpen=true}
function doWipe(){S=fresh();tab='hoy';view=null;save();closeSheet()}
window.onBack=function(){if(sheetOpen){closeSheet();return true}if(S.onboarded&&tab!=='hoy'){setTab('hoy');return true}return false};
window.MC={periods:periods,analyze:analyze,classify:classify,toN:toN,toS:toS,valid:valid};
render();
</script>
</body>
</html>
