<style>

.bars{height:3px;background:#fff5;margin:10px}.bars i{display:block;height:100%;background:#fff}

.call video{position:absolute;background:#000}#rv{inset:0;width:100%;height:100%;object-fit:cover}#lv{right:14px;top:14px;width:104px;height:150px;object-fit:cover;border-radius:12px;z-index:1}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222e;color:#fff;padding:10px 15px;border-radius:12px;font-size:14px;z-index:12;max-width:90%;text-align:center}
.setup{flex:1;overflow:auto;padding:30px 20px 20px;display:flex;flex-direction:column}.setup h1{font-size:28px;font-weight:600;text-align:center;margin-bottom:6px}

.pd{display:flex;gap:14px;margin:18px}.pd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--soft)}.pd i.on{background:var(--brand);border-color:var(--brand)}
.keys{display:grid;grid-template-columns:repeat(3,70px);gap:12px}.keys button{height:70px;border-radius:50%;background:var(--sunk);font-size:24px;text-align:center}
</style>

<script>
'use strict';
const SV=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const I={chat:SV('M21 11.5a8.500 8.500 0 0 1-12.400 7.500L4 20.500l1.500-4.300A8.500 8.500 0 1 1 21 11.500z'),status:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="4 2.500"/><circle cx="12" cy="12" r="4.500"/></svg>',
 call:SV('M6 3.500l3 .5 1.500 4-2 1.500c1 2.500 3 4.500 5.500 5.500l1.500-2 4 1.500.5 3c0 1.500-1.500 2.500-3 2.500C9.500 20 4 14.500 3.500 6.500c0-1.500 1-3 2.500-3z'),video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11l5-3v8l-5-3z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>',dots:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5.500" r="1.200" fill="currentColor"/><circle cx="12" cy="12" r="1.200" fill="currentColor"/><circle cx="12" cy="18.500" r="1.200" fill="currentColor"/></svg>',
 back:SV('M19 12H5M11 6l-6 6 6 6'),plus:SV('M12 5v14M5 12h14'),send:SV('M4.500 12L20 4.500 16 20l-4-6z'),mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.500 11.500a6.500 6.500 0 0 0 13 0M12 18v3"/></svg>',
 clip:SV('M20 11l-8 8a5 5 0 0 1-7-7l8.500-8.500a3.300 3.300 0 0 1 4.700 4.700L10 16.500a1.600 1.600 0 0 1-2.300-2.300L15 7'),cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3.500L9 5.500h6L16.500 8H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.500"/></svg>',x:SV('M6 6l12 12M18 6L6 18'),pencil:SV('M4 20l1-4L16 5l3 3L8 19z')};
const AV=['#128c5e','#2f6fb5','#a0522d','#7b4fc4','#b0307a','#16827f','#8a6a12'];
const BG=['#128c5e','#2f6fb5','#7b4fc4','#b0307a','#b65a14'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let ME,ME_PROF,PREFS,CHATS,PROFS,PEERS={},STAT,CALLS,tab='chats',screen='home',current=null,MSGS=[],media={},draft={},replyTo=null,filter='todos',query='',searching=false,inSearch='',lockBuf=null;
const sentProf=new Set(),wasOnline={},typing={};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=(s,d)=>{try{const v=JSON.parse(s);return v==null?d:v}catch(e){return d}};
const kget=(k,d)=>parse(Android.kvGet(k),d);
function kset(k,v){if(!Android.kvSet(k,JSON.stringify(v)))toast('No se pudo guardar. Revisa el espacio de tu teléfono.')}
function genId(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>('0'+x.toString(16)).slice(-2)).join('')}
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function hue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return AV[Math.abs(h)%AV.length]}
function initials(n){const w=String(n||'?').trim().split(/\s+/);return esc(((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase())}
const VALID_AV=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function avatar(id,cl){const c=CHATS[id],p=id===ME?ME_PROF:PROFS[id],n=c&&c.type==='group'?c.name:(p&&p.name)||(PEERS[id]&&PEERS[id].name)||'?',a=p&&p.avatar&&VALID_AV.test(p.avatar)?`<img alt="" src="${p.avatar}">`:'';return `<div class="av ${cl||''}" style="background:${hue(id)}" aria-hidden="true">${a||initials(n)}</div>`}
const clock=t=>{const d=new Date(t);return d.getHours()+':'+('0'+d.getMinutes()).slice(-2)};
const dayK=t=>new Date(t).toDateString();
function dayL(t){const d=new Date(t),n=new Date();if(dayK(t)===n.toDateString())return'Hoy';if(dayK(t)===new Date(n-864e5).toDateString())return'Ayer';return d.getDate()+' '+MON[d.getMonth()]}
const listT=t=>dayK(t)===dayK(Date.now())?clock(t):dayL(t);
const nameOf=id=>id===ME?'Tú':(PROFS[id]&&PROFS[id].name)||(PEERS[id]&&PEERS[id].name)||'Sin nombre';
const isOn=id=>!!(PEERS[id]&&PEERS[id].online);
function applyTheme(){const dk=PREFS.mode==='dark'||(PREFS.mode!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',dk);document.documentElement.style.colorScheme=dk?'dark':'light';if(PREFS.wall)document.documentElement.style.setProperty('--wall',PREFS.wall);else document.documentElement.style.removeProperty('--wall');if(Android.setBars)Android.setBars(dk?'#121c20':'#ffffff',dk?'#121c20':'#ffffff',!dk)}
const saveChats=()=>kset('chats',CHATS),savePrefs=()=>kset('prefs',PREFS),saveProfs=()=>kset('profs',PROFS);
const blocked=id=>(PREFS.blocked||[]).includes(id);

/* ---- mensajes ---- */
const msgsOf=id=>id===current?MSGS:kget('m_'+id,[]);
function saveMsgs(id,a){if(a.length>3000)a.splice(0,a.length-3000).forEach(m=>m.media&&Android.kvSet('i_'+m.id,null));kset('m_'+id,a)}
const mediaOf=id=>{if(!media[id])media[id]=Android.kvGet('i_'+id)||'';return media[id]};
const previewOf=m=>m.deleted?'Se eliminó este mensaje':(m.media==='img'?'Foto ':m.media==='audio'?'Nota de voz ':'')+(m.text||'');
function ensureDm(id){if(!CHATS[id])CHATS[id]={id,type:'dm',name:nameOf(id),last:0,preview:'',unread:0};return CHATS[id]}
const chatName=c=>c.type==='group'?c.name:nameOf(c.id);
function pushMsg(chat,m,inc){const a=msgsOf(chat.id);if(a.some(x=>x.id===m.id))return false;a.push(m);a.sort((x,y)=>x.ts-y.ts);saveMsgs(chat.id,a);chat.last=Math.max(chat.last||0,m.ts);chat.preview=previewOf(m);chat.lastId=m.id;chat.lastMine=m.from===ME;chat.archived=inc?chat.archived&&false:chat.archived;if(inc&&chat.id!==current)chat.unread=(chat.unread||0)+1;return true}
const VID=/^[0-9a-f]{8,48}$/,VIMG=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/,VAUD=/^data:audio\/(webm|mp4|ogg)(;codecs=[a-z0-9.]+)?;base64,[A-Za-z0-9+\/=]+$/;
function wire(c,body,id,kind){if(c.type==='group'){body.group={id:c.id,name:c.name,members:c.members};const s=JSON.stringify(body);c.members.filter(x=>x.id!==ME).forEach(x=>Android.send(x.id,id+'-'+x.id.slice(0,8),kind,s))}else Android.send(c.id,id,kind,JSON.stringify(body))}
function sendMsg(o){const c=CHATS[current];if(!c)return;const id=genId(),ts=Date.now(),m={id,from:ME,ts,text:o.text||'',status:'pending',seen:true};
 if(o.media){m.media=o.media;if(o.dur)m.dur=o.dur;media[id]=o.data;Android.kvSet('i_'+id,o.data)}
 if(replyTo){m.reply={id:replyTo.id,from:replyTo.from,text:previewOf(replyTo).slice(0,120)};replyTo=null;drawReply()}if(o.fwd)m.fwd=true;
 pushMsg(c,m,false);saveChats();const b={t:'msg',id,ts,text:m.text,fwd:m.fwd,reply:m.reply,media:m.media,dur:m.dur};if(o.media)b.data=o.data;wire(c,b,id,1);drawMsgs(true)}
function forwardTo(cid,mid){const c0=CHATS[current],m=MSGS.find(x=>x.id===mid);if(!m)return;closeO();const cur=current;current=cid;MSGS=kget('m_'+cid,[]);ensureDm(cid);if(!CHATS[cid])return;replyTo=null;sendMsg({text:m.text,media:m.media,dur:m.dur,data:m.media?(media[mid]||Android.kvGet('i_'+mid)):null,fwd:true});openChat(cid);toast('Reenviado')}
function inbox(items){let ch=false;const rd={};items.forEach(it=>{
 if(it.ack||it.failed){const id=(it.ack||it.failed).split('-')[0];Object.keys(CHATS).some(k=>{const a=msgsOf(k),f=a.find(x=>x.id===id&&x.status==='pending');if(f){f.status=it.ack?'sent':'failed';saveMsgs(k,a);ch=true;return true}return false});return}
 if(!it.from||blocked(it.from))return;const p=parse(it.payload,null);if(!p||typeof p!=='object')return;const f=it.from;
 switch(p.t){
  case'profile':PROFS[f]=Object.assign(PROFS[f]||{},{name:String(p.name||'').slice(0,40),user:String(p.user||'').slice(0,24),about:String(p.about||'').slice(0,140),avatar:typeof p.avatar==='string'&&VALID_AV.test(p.avatar)&&p.avatar.length<2e5?p.avatar:''});saveProfs();if(CHATS[f]){CHATS[f].name=PROFS[f].name;saveChats()}ch=true;break;
  case'typing':typing[f]={until:Date.now()+4000,chat:typeof p.chat==='string'?p.chat:f};if(screen==='chat')drawHead();break;
  case'read':if(Array.isArray(p.ids)){const a=msgsOf(f);let d=false;a.forEach(x=>{if(x.from===ME&&p.ids.includes(x.id)&&x.status!=='read'){x.status='read';d=true}});if(d){saveMsgs(f,a);ch=true}}break;
  case'del':Object.keys(CHATS).some(k=>{const a=msgsOf(k),x=a.find(y=>y.id===p.id);if(x&&x.from===f){if(x.media)Android.kvSet('i_'+x.id,null);delete media[x.id];Object.assign(x,{deleted:true,text:'',media:null,reply:null});saveMsgs(k,a);if(CHATS[k].lastId===x.id)CHATS[k].preview=previewOf(x);ch=true;return true}return false});break;
  case'status':recvStatus(f,p);ch=true;break;
  case'call':onCallSignal(f,p);break;
  case'msg':{if(!VID.test(String(p.id)))return;const text=typeof p.text==='string'?p.text.slice(0,5000):'';let mt=null;if(p.media==='img'&&typeof p.data==='string'&&VIMG.test(p.data))mt='img';if(p.media==='audio'&&typeof p.data==='string'&&VAUD.test(p.data))mt='audio';if(!text&&!mt)return;

   if(pushMsg(chat,m,true)){ch=true;if(vis&&chat.type==='dm')(rd[chat.id]=rd[chat.id]||[]).push(p.id)}}}
});Object.keys(rd).forEach(k=>sendRead(k,rd[k]));if(ch){saveChats();refresh()}}

let call=null;
function logCall(peer,video,out,missed){CALLS.push({peer,video,out,missed,ts:Date.now()});if(CALLS.length>200)CALLS.shift();kset('calls',CALLS);if(screen==='home'&&tab==='calls')render()}
function sig(peer,o){Android.send(peer,genId(),o.a==='offer'?1:0,JSON.stringify(Object.assign({t:'call',ts:Date.now()},o)))}

async function startCall(peer,video){if(call)return toast('Ya estás en una llamada.');if(!isOn(peer))return toast('Solo puedes llamar cuando esté en línea en tu red.');if(blocked(peer))return toast('Desbloquea este contacto para llamarle.');try{const cid=genId();call={cid,peer,video,out:true,state:'calling',muted:false,camOff:false};drawCall();call.local=await media0(video);if(Android.callAudio)Android.callAudio(true,video);call.pc=newPC();call.local.getTracks().forEach(t=>call.pc.addTrack(t,call.local));const lv=$('lv');if(lv)lv.srcObject=call.local;await call.pc.setLocalDescription(await call.pc.createOffer());await iceDone(call.pc);sig(peer,{a:'offer',cid,video,sdp:call.pc.localDescription.sdp});logCall(peer,video,true,false);call.to=setTimeout(()=>endCall(true,'No contestó.'),40000)}catch(e){cleanup();toast('Permite el micrófono'+(video?' y la cámara':'')+' para llamar.')}}
function onCallSignal(f,p){if(typeof p.cid!=='string'||Date.now()-(+p.ts||0)>45000)return;

function drawCall(){const c=call;if(!c)return;const label={calling:'Llamando…',ringing:c.video?'Videollamada entrante':'Llamada entrante',connecting:'Conectando…',on:''}[c.state];
 const keep=$('rv')&&$('rv').srcObject,keepL=$('lv')&&$('lv').srcObject;
 $('callui').innerHTML=`<div class="call" role="dialog" aria-label="Llamada">${c.video&&c.state!=='ringing'?'<video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>':'<audio id="rv" autoplay></audio>'}<div class="inf">${c.video&&c.state==='on'?'':avatar(c.peer,'l').replace('style="','style="margin:0 auto;')}<h2>${esc(nameOf(c.peer))}</h2><div id="cdur">${label}</div></div><div class="ctl">${c.state==='ringing'?`<button class="cbtn end" aria-label="Rechazar" onclick="rejectCall()">${I.x}</button><button class="cbtn ok" aria-label="Contestar" onclick="acceptCall()">${I.call}</button>`:`<button class="cbtn ${c.muted?'on':''}" aria-pressed="${!!c.muted}" onclick="togMute()">Silencio</button>${c.video?`<button class="cbtn ${c.camOff?'on':''}" aria-pressed="${!!c.camOff}" onclick="togCam()">Cámara</button>`:`<button class="cbtn ${c.spk?'on':''}" aria-pressed="${!!c.spk}" onclick="togSpk()">Altavoz</button>`}<button class="cbtn end" aria-label="Colgar" onclick="endCall(true)">${I.x}</button>`}</div></div>`;
 const rv=$('rv'),lv=$('lv');if(rv&&(c.remote||keep))rv.srcObject=c.remote||keep;if(lv&&(c.local||keepL))lv.srcObject=c.local||keepL}

/* ---- ciclo ---- */
function loadPeers(){const a=parse(Android.peers(),[]);PEERS={};let d=false;a.forEach(p=>{PEERS[p.id]=p;if(wasOnline[p.id]&&!p.online){PROFS[p.id]=PROFS[p.id]||{};PROFS[p.id].lastSeen=Date.now();d=true;sentProf.delete(p.id)}wasOnline[p.id]=p.online;if(p.name&&!(PROFS[p.id]&&PROFS[p.id].name)){PROFS[p.id]=PROFS[p.id]||{};PROFS[p.id].name=p.name;d=true}});if(d)saveProfs()}
function loop(){inbox(parse(Android.drain(),[]));const b=JSON.stringify(PEERS);loadPeers();if(ME_PROF.name)syncProfiles();if(JSON.stringify(PEERS)!==b)refresh()}
window.onLan=loop;
window.onBack=()=>{if(pinMode==='unlock')return false;if(pinMode){$('lockui').innerHTML='';pinMode=null;return true}if(call)return true;if($('overlay').innerHTML){closeO();return true}if(screen==='chat'){leaveChat();return true}if(screen==='profile'){screen='settings';render();return true}if(screen!=='home'){screen='home';render();return true}if(tab!=='chats'){setTab('chats');return true}return false};
let pausedAt=0;window.onAppPause=()=>{pausedAt=Date.now()};
window.onAppResume=()=>{if(PREFS.pin&&!pinMode&&pausedAt&&Date.now()-pausedAt>30000){pinMode='unlock';lockBuf='';drawLock()}pausedAt=0;if(screen==='chat')markSeen();loop()};
function boot(){ME=Android.id();PREFS=kget('prefs',{mode:'auto',blocked:[]});CHATS=kget('chats',{});PROFS=kget('profs',{});STAT=kget('stat',[]);CALLS=kget('calls',[]);ME_PROF=kget('me',{name:'',user:'',about:'',avatar:''});applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);loadPeers();render();loop();setInterval(loop,1500);if(PREFS.pin){pinMode='unlock';lockBuf='';drawLock()}if(Android.requestNotifications)Android.requestNotifications()}
boot();
</script>
